title: Disclosure Community
tagline: Columbus, Ohio
description: >-
  An emerging community of people in Columbus, Ohio, caring for each
  other as the UAP disclosure moment unfolds. Open-minded, curious,
  welcoming, non-dogmatic.

url: https://disclosurecommunity.org
baseurl: ""

# Site identity
location: Columbus, Ohio
email: hello@disclosurecommunity.org
github_username: disclosurecommunity

# Google Calendar (native event cards)
# 1. google_calendar_id: the PUBLIC calendar's ID — use a dedicated
#    calendar (e.g. c_xxxx@group.calendar.google.com), never a
#    personal primary calendar.
# 2. google_calendar_api_key: a Google Cloud API key restricted to
#    the Calendar API and to this site's domains (HTTP referrers).
# When both are set, /events/ and the home "Next gathering" card pull
# live from the calendar; the file-based _events/ list is the fallback.
google_calendar_id: ""
google_calendar_api_key: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/
timezone: America/New_York

collections:
  events:
    output: true
    permalink: /events/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: events
    values:
      layout: event
  - scope:
      path: ""
      type: pages
    values:
      layout: page

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - AI.md
  - README.md
  - transcripts/
  - reference/
  - images/
  - vendor/
  - .bundle/
  - node_modules/
  - "*.code-workspace"

navigation:
  - title: About
    url: /about/
  - title: Leadership
    url: /leadership/
  - title: Events
    url: /events/
  - title: Blog
    url: /blog/
  - title: Contact
    url: /contact/
