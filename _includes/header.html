<header class="site-header">
  <div class="container">
    <a class="site-title" href="{{ '/' | relative_url }}">
      <span class="site-title-mark" aria-hidden="true">✦</span>
      <span class="site-title-text">{{ site.title }}</span>
      <span class="site-title-emoji" aria-hidden="true">👽</span>
    </a>
    <p class="site-tagline">{{ site.tagline }}</p>

    <nav class="site-nav" aria-label="Primary">
      <ul>
        {% for item in site.navigation %}
          <li>
            <a href="{{ item.url | relative_url }}"
               {% if page.url contains item.url %}aria-current="page"{% endif %}>
              {{ item.title }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
