<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">

  {% if site.google_calendar_id and site.google_calendar_id != "" and site.google_calendar_api_key and site.google_calendar_api_key != "" %}
  <script>
    window.GCAL = { id: {{ site.google_calendar_id | jsonify }}, key: {{ site.google_calendar_api_key | jsonify }} };
    window.SITE_BASEURL = {{ site.baseurl | jsonify }};
  </script>
  <script defer src="{{ '/assets/js/calendar.js' | relative_url }}"></script>
  {% endif %}
</head>
