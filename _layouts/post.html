---
layout: default
---
<article class="post container">
  <header class="page-header page-header-branded">
    <div class="page-heading-copy">
      <p class="post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
        {% if page.author %} &middot; {{ page.author }}{% endif %}
      </p>
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
    </div>
    {% include page-logo.html %}
  </header>

  <div class="post-content prose">
    {{ content }}
  </div>

  <p class="back-link"><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
</article>
